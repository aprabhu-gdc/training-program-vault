# Test, build and deploy the Claude analytics connector (apps/analytics_mcp).
# Independent of the App Service workflow. Deploy runs only on main and only
# once the repository variables below exist (see docs/claude-analytics-connector.md):
#   vars:    CONNECTOR_RESOURCE_GROUP, CONNECTOR_APP_NAME
#   secrets: CONNECTOR_AZURE_CLIENT_ID, CONNECTOR_AZURE_TENANT_ID, CONNECTOR_AZURE_SUBSCRIPTION_ID

name: Analytics connector

on:
  push:
    branches: [main]
    paths:
      - "apps/analytics_mcp/**"
      - "packages/wiki_core/analytics/**"
      - "teams_bot/services/analytics.py"
      - "teams_bot/services/concept_labels.py"
      - "tests/unit/test_analytics_mcp_*.py"
      - ".github/workflows/analytics-connector.yml"
  pull_request:
    paths:
      - "apps/analytics_mcp/**"
      - "packages/wiki_core/analytics/**"
      - "teams_bot/services/analytics.py"
      - "teams_bot/services/concept_labels.py"
      - "tests/unit/test_analytics_mcp_*.py"
      - ".github/workflows/analytics-connector.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/training-analytics-connector

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install connector dependencies
        run: |
          python -m pip install -r apps/analytics_mcp/requirements.txt "pytest>=8.0,<9.0" "pytest-asyncio>=0.23,<0.25"
      - name: Run connector tests
        run: python -m pytest tests/unit/test_analytics_mcp_pure.py tests/unit/test_analytics_mcp_tools.py -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=${IMAGE,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/analytics_mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.CONNECTOR_APP_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONNECTOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONNECTOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONNECTOR_AZURE_SUBSCRIPTION_ID }}
      - name: Roll the container app to the new image
        run: |
          az containerapp update \
            --name "${{ vars.CONNECTOR_APP_NAME }}" \
            --resource-group "${{ vars.CONNECTOR_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image }}"
